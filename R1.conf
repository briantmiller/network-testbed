frr version 10.8.0-dev
frr defaults traditional
hostname R1
log file /var/log/frr/frr.log
!
interface net0.501
 ip address 10.0.1.1/30
 ip ospf area 0
 link-type vlan parent net0 id 501
exit
!
interface wan1.100
 ip address 10.0.0.1/30
 ip ospf area 0
 ip ospf dead-interval 8
 ip ospf hello-interval 2
 ip ospf packet-pair interval 5 probes 20
 link-type vlan parent wan1 id 100
exit
!
router ospf
exit
!
access-list VOICE seq 5 deny 10.1.1.0/24
access-list VOICE seq 10 permit 10.0.0.0/8
access-list MGMT seq 5 permit ip 10.0.0.0 0.0.0.255 any
access-list WEB seq 5 permit ip 10.0.1.0 0.0.0.255 any
!
ipv6 access-list VOICE seq 5 permit 2001:db8:99::/48
!
ip access-list extended WEBX
 10 permit tcp 10.0.1.0 0.0.0.255 any
exit
!
class-map match-any VOICE
 match ip dscp ef
exit
!
class-map match-all MGMT
 match access-group name MGMT
 match ip dscp cs6
exit
!
class-map match-all WEB
 match access-group name WEBX
exit
!
class-map match-all BULK
 match ip dscp cs1
exit
!
policy-map CHILD
 class BULK
  bandwidth percent 30
  queue-limit 200 packets
 exit
 class class-default
  bandwidth percent 70
 exit
exit
!
policy-map PARENT
 class VOICE
  bandwidth 5mbps
  max-bandwidth percent 50
  priority 0
  queue-limit 64 packets
 exit
 class MGMT
  bandwidth percent 5
  priority 1
 exit
 class WEB
  bandwidth percent 20
  priority 2
  service-policy CHILD
 exit
 class class-default
  bandwidth percent 10
  max-bandwidth 15mbps
 exit
exit
!
policy-map HCHILD hfsc
 class BULK
  ls m2 percent 5
  queue-limit 200 packets
  ul m2 8mbps
 exit
exit
!
policy-map HPARENT hfsc
 class VOICE
  ls m2 percent 20
  queue-limit 64 packets
  rt m1 4mbps d 10ms m2 2mbps
 exit
 class WEB
  sc m2 percent 40
  service-policy HCHILD
  ul m2 percent 75
 exit
 class class-default
  ls m1 percent 30 d 20ms m2 1500kbps
 exit
 class MGMT
  sc m2 percent 1
 exit
exit
!
router pim
 no autorp discovery
exit
!
