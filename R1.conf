frr version 10.9.0-dev
frr defaults traditional
hostname R1
log file /var/log/frr/frr.log
!
interface net0.501
 ip address 10.0.1.1/30
 ip ospf area 0
 link-type vlan parent net0 id 501
exit
!
interface wan1.100
 ip address 10.0.0.1/30
 ip ospf area 0
 ip ospf dead-interval 8
 ip ospf hello-interval 2
 ip ospf packet-pair interval 5 probes 20
 ip ospf packet-pair train span 20
 link-type vlan parent wan1 id 100
 qos bandwidth detected ospf percent 95 hysteresis increase 10 default 5mbps
 service-policy output PARENT
exit
interface wan1.101
 ip address 10.0.0.5/30
 ip ospf area 0
 ip ospf dead-interval 8
 ip ospf hello-interval 2
 ip ospf packet-pair interval 5 probes 20
 ip ospf packet-pair train span 20
 link-type vlan parent wan1 id 101
 qos bandwidth detected ospf percent 95 hysteresis increase 10 default 5mbps
 service-policy output PARENT
exit
interface wan1.102
 ip address 10.0.0.9/30
 ip ospf area 0
 ip ospf dead-interval 8
 ip ospf hello-interval 2
 ip ospf packet-pair interval 5 probes 20
 ip ospf packet-pair train span 20
 link-type vlan parent wan1 id 102
 qos bandwidth detected ospf percent 95 hysteresis increase 10 default 5mbps
 service-policy output PARENT
exit
interface wan1.103
 ip address 10.0.0.13/30
 ip ospf area 0
 ip ospf dead-interval 8
 ip ospf hello-interval 2
 ip ospf packet-pair interval 5 probes 20
 ip ospf packet-pair train span 20
 link-type vlan parent wan1 id 103
 qos bandwidth detected ospf percent 95 hysteresis increase 10 default 5mbps
 service-policy output PARENT
exit
interface wan1.104
 ip address 10.0.0.17/30
 ip ospf area 0
 ip ospf dead-interval 8
 ip ospf hello-interval 2
 ip ospf packet-pair interval 5 probes 20
 ip ospf packet-pair train span 20
 link-type vlan parent wan1 id 104
 qos bandwidth detected ospf percent 95 hysteresis increase 10 default 5mbps
 service-policy output PARENT
exit
!
router ospf
exit
!
access-list VOICE seq 5 deny 10.1.1.0/24
access-list VOICE seq 10 permit 10.0.0.0/8
access-list MGMT seq 5 permit ip 10.0.0.0 0.0.0.255 any
access-list WEB seq 5 permit ip 10.0.1.0 0.0.0.255 any
!
ipv6 access-list VOICE seq 5 permit 2001:db8:99::/48
!
class-map match-any VOICE
 match ip dscp ef
exit
!
class-map match-all MGMT
 match access-group name MGMT
 match ip dscp cs6
exit
!
class-map match-all WEB
 match access-group name WEB
exit
!
class-map match-all BULK
 match ip dscp cs1
exit
!
policy-map CHILD
 class BULK
  bandwidth percent 30
  queue-limit 200 packets
 exit
 class class-default
  bandwidth percent 70
 exit
exit
!
policy-map PARENT
 class VOICE
  bandwidth 5mbps
  max-bandwidth percent 50
  priority 0
  queue-limit 64 packets
 exit
 class MGMT
  bandwidth percent 5
  priority 1
 exit
 class WEB
  bandwidth percent 20
  priority 2
  service-policy CHILD
 exit
 class class-default
  bandwidth percent 10
  max-bandwidth 15mbps
 exit
exit
!
router pim
 no autorp discovery
exit
!
